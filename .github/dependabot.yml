version: 2
# One grouped PR per ecosystem a month. Security updates still open right away.
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      bundler:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ruby"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # TypeScript 7 (the native compiler) has no compiler API: Dumbcourse's
      # build compiles to ES5 through it (dumbcourse/build.ts). Move by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"
